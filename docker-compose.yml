services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tr4ce
      POSTGRES_PASSWORD: tr4ce
      POSTGRES_DB: tr4ce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tr4ce"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - tr4ce-postgres:/var/lib/postgresql/data

volumes:
  tr4ce-postgres:
