specVersion: v0.1.0

package:
  # 'v' prefix is mandatory here even though plain semver is otherwise valid.
  name: tr4ce_erc4626
  version: v0.1.0
  url: https://github.com/tr4ce/tr4ce
  description: >
    Normalized, typed ERC-4626 vault observations: Deposit, Withdraw and ShareTransfer events plus
    block-scoped vault snapshots, with a PostgreSQL Database Changes output. The curated vault set
    is supplied at runtime through params, so the module is reusable against any ERC-4626 vaults.

imports:
  database: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg

protobuf:
  files:
    - tr4ce/v1/vault.proto
  importPaths:
    - ./proto
  # Required because the imported spkg already carries these definitions.
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    # Cargo turns the package name's hyphens into underscores.
    file: ./target/wasm32-unknown-unknown/release/tr4ce_erc4626.wasm

network: base

modules:
  - name: map_vault_events
    kind: map
    initialBlock: 50577041
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tr4ce.v1.VaultEvents

  - name: map_vault_block_batch
    kind: map
    initialBlock: 50577041
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_vault_events
    output:
      type: proto:tr4ce.v1.VaultBlockBatch

  - name: db_out
    kind: map
    initialBlock: 50577041
    inputs:
      - map: map_vault_block_batch
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

# Curated vault set, generated from packages/test-vaults/src/manifest.json. Every address here
# passed the ten-step onboarding gate in docs/technical/INTEGRATIONS.md section 4 against live
# chain state; a drift test in @tr4ce/test-vaults asserts this string still matches the manifest.
#
# Format:
#   chain_id=<n>&anchor_block=<n>&checkpoint_interval=<n>&vaults=<vault>:<asset>:<shareDec>:<assetDec>,...
#
# Override at runtime with -p <module>=<params> to point the module at a different vault set.
params:
  map_vault_events: "chain_id=8453&anchor_block=50577041&checkpoint_interval=1800&vaults=ee8f4ec5672f09119b96ab6fb59c27e1b7e44b61:833589fcd6edb6e08f4c7c32d4f71b54bda02913:18:6,ef417a2512c5a41f69ae4e021648b69a7cde5d03:833589fcd6edb6e08f4c7c32d4f71b54bda02913:18:6,f115c134c23c7a05fbd489a8be3116ebf54b0d9f:833589fcd6edb6e08f4c7c32d4f71b54bda02913:6:6,c3bd0a2193c8f027b82dde3611d18589ef3f62a9:833589fcd6edb6e08f4c7c32d4f71b54bda02913:6:6"
  map_vault_block_batch: "chain_id=8453&anchor_block=50577041&checkpoint_interval=1800&vaults=ee8f4ec5672f09119b96ab6fb59c27e1b7e44b61:833589fcd6edb6e08f4c7c32d4f71b54bda02913:18:6,ef417a2512c5a41f69ae4e021648b69a7cde5d03:833589fcd6edb6e08f4c7c32d4f71b54bda02913:18:6,f115c134c23c7a05fbd489a8be3116ebf54b0d9f:833589fcd6edb6e08f4c7c32d4f71b54bda02913:6:6,c3bd0a2193c8f027b82dde3611d18589ef3f62a9:833589fcd6edb6e08f4c7c32d4f71b54bda02913:6:6"

sink:
  module: db_out
  type: sf.substreams.sink.sql.service.v1.Service
  config:
    schema: ./schema.sql
    engine: postgres
